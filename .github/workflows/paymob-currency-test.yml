name: Paymob currency test

on:
  workflow_dispatch:
    inputs:
      amount:
        description: Test amount in the selected currency
        required: true
        default: "200"
      currency:
        description: ISO currency code requested from Paymob
        required: true
        default: USD

permissions:
  contents: write

concurrency:
  group: paymob-currency-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Send test intention to Paymob
        env:
          PAYMOB_TEST_SECRET_KEY: ${{ secrets.PAYMOB_TEST_SECRET_KEY }}
          PAYMOB_TEST_PUBLIC_KEY: ${{ secrets.PAYMOB_TEST_PUBLIC_KEY }}
          PAYMOB_TEST_INTEGRATION_ID: ${{ secrets.PAYMOB_TEST_INTEGRATION_ID }}
          PAYMOB_TEST_AMOUNT: ${{ inputs.amount }}
          PAYMOB_TEST_CURRENCY: ${{ inputs.currency }}
        run: node scripts/paymob-currency-test.mjs
      - name: Publish the sanitized test result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paymob-test-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: record Paymob currency response"
          git push origin HEAD:main
